name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm must be set up BEFORE setup-node so the caching works correctly.
      # setup-node with cache:'pnpm' looks for pnpm-lock.yaml in the repo root —
      # that file must be committed (see SETUP-GUIDE.md if CI fails with
      # "Dependencies lock file is not found").
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Type checks ──────────────────────────────────────────────────────────

      - name: Typecheck — shared
        run: pnpm --filter @claude-reset/shared typecheck

      - name: Typecheck — extension
        run: pnpm --filter @claude-reset/extension typecheck

      - name: Typecheck — companion PWA
        run: pnpm --filter @claude-reset/companion-pwa typecheck

      - name: Typecheck — dispatcher
        run: pnpm --filter @claude-reset/dispatcher typecheck

      # ── Builds ───────────────────────────────────────────────────────────────
      # Secrets must be added to the repo before these steps will succeed:
      #   Repo → Settings → Secrets and variables → Actions → New repository secret
      #   Required: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
      #             VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
      #             VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
      #             VITE_GOOGLE_CLIENT_ID

      - name: Build — extension
        run: pnpm --filter @claude-reset/extension build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Build — companion PWA
        run: pnpm --filter @claude-reset/companion-pwa build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
